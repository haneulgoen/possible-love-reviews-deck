  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1120" cy="300" r="420" fill="url(#glow)"/>
  <rect y="600" width="1600" height="300" fill="url(#sea)"/>
  <circle cx="1120" cy="300" r="132" fill="url(#moon)"/>
  <g opacity="0.85">
