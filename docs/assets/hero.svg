<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1226"/><stop offset="0.55" stop-color="#132445"/><stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.4" cy="0.36" r="0.65">
      <stop offset="0" stop-color="#fff7da"/><stop offset="0.55" stop-color="#f2c14e"/><stop offset="1" stop-color="#a86f16"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f2c14e" stop-opacity="0.55"/><stop offset="1" stop-color="#f2c14e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1830"/><stop offset="1" stop-color="#03050a"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
