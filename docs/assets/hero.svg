    <path d="M0 740 Q500 710 1000 744 T1600 736 L1600 900 L0 900Z" fill="#060d1c"/>
  </g>
  <path d="M1120 432 L1120 620" stroke="#f2c14e" stroke-opacity="0.18" stroke-width="46" stroke-linecap="round"/>
  <g fill="#02040a">
    <ellipse cx="330" cy="690" rx="34" ry="60"/>
    <circle cx="330" cy="612" r="24"/>
    <ellipse cx="410" cy="700" rx="30" ry="54"/>
    <circle cx="410" cy="630" r="21"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)"/>
