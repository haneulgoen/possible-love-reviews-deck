    <rect x="1180" y="240" width="100" height="420" fill="#7aa2f7" opacity="0.1"/>
  </g>
  <rect x="792" width="16" height="900" fill="#05060a" opacity="0.9"/>
  <rect x="790" width="3" height="900" fill="#f2c14e" opacity="0.55"/>
  <rect width="1600" height="900" fill="url(#fade)"/>
</svg>
