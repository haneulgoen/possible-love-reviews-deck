<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1a0e"/><stop offset="1" stop-color="#5a3a1c"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a30"/><stop offset="1" stop-color="#1b2f52"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060a" stop-opacity="0.2"/><stop offset="1" stop-color="#05060a" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>
  <rect width="800" height="900" fill="url(#left)"/>
